<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Phorcysty — AI Creative Editor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         HERO
    ========================================== -->

    <section class="hero">

        <!-- Star field -->
        <div class="stars"></div>
        <div class="stars stars-2"></div>

        <!-- Ambient glow -->
        <div class="space-glow"></div>

        <!-- 3D Earth -->
        <div id="earth-container"></div>

        <!-- Optional dark vignette -->
        <div class="vignette"></div>

        <!-- Website content -->
        <div class="hero-content">

            <div class="brand">
                <div class="brand-mark">✦</div>
                <span>PHORCYSTY</span>
            </div>

            <div class="hero-copy">

                <div class="eyebrow">
                    AI CREATIVE EDITOR
                </div>

                <h1>
                    Transform
                    <span>Every Moment</span>
                </h1>

                <p>
                    Color transfer, cinematic looks, style transfer
                    and powerful AI tools for images and videos.
                </p>

                <div class="hero-buttons">

                    <button class="primary-btn">
                        Try Phorcysty
                        <span>→</span>
                    </button>

                    <button class="secondary-btn">
                        Explore Tools
                    </button>

                </div>

            </div>

        </div>

        <!-- Bottom scroll indicator -->
        <div class="scroll-indicator">
            <span></span>
            Explore
        </div>

    </section>


    <!-- =========================================
         THREE.JS
    ========================================== -->

    <script type="importmap">
    {
        "imports": {
            "three":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }
    </script>

    <script type="module" src="script.js"></script>

</body>
</html>
